<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img">
  <title>最小数据模型</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="#243044"/></marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="#0f5f5c"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="#1d4e89"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="24" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#1d4e89">一次尝试的身份链</text>
  <text x="168" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#526072">计划修订撤销旧结果资格；观察更新新建 revision，不改写历史请求</text>
  <rect x="24" y="56" width="240" height="168" rx="8" fill="#ffffff" stroke="#243044" stroke-width="1.5"/>
  <text x="144" y="84" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#1d4e89">Task</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">
    <text x="40" y="112">task_id</text>
    <text x="40" y="132">arrival · deadline · class</text>
    <text x="40" y="152">goal · status</text>
    <text x="40" y="180" fill="#526072">成功只计一次</text>
    <text x="40" y="200" fill="#526072">重算不新开任务分母</text>
  </g>
  <rect x="340" y="56" width="270" height="168" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="2"/>
  <text x="475" y="84" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#1d4e89">RequestAttempt</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">
    <text x="356" y="112">task_id · attempt_id</text>
    <text x="356" y="132">plan_epoch · obs_revision</text>
    <text x="356" y="152">state</text>
    <text x="356" y="180" fill="#526072">旧 epoch 不能提交</text>
    <text x="356" y="200" fill="#526072">终态不被迟到回调覆盖</text>
  </g>
  <rect x="690" y="56" width="386" height="168" rx="8" fill="#ffffff" stroke="#243044" stroke-width="1.5"/>
  <text x="883" y="84" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#1c2430">CandidateAction</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">
    <text x="706" y="112">action_id · task_id</text>
    <text x="706" y="132">epoch · revision · parameters</text>
    <text x="706" y="152">predicates</text>
    <text x="706" y="180" fill="#526072">网关重绑真实观测</text>
    <text x="706" y="200" fill="#526072">不信任模型自报的 source_id</text>
  </g>
  <line x1="264" y1="140" x2="332" y2="140" stroke="#243044" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="132" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#526072">1 : N</text>
  <line x1="610" y1="140" x2="682" y2="140" stroke="#243044" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="646" y="132" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#526072">1 : N</text>
  <text x="24" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#0f5f5c">观察、资格与证据</text>
  <rect x="24" y="288" width="240" height="150" rx="8" fill="#e6f4f3" stroke="#0f5f5c"/>
  <text x="144" y="316" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#0f5f5c">RefreshRecipe</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">
    <text x="40" y="344">read_tool · args · sources</text>
    <text x="40" y="364">timeout · cost_estimate</text>
    <text x="40" y="384">merge_key</text>
    <text x="40" y="412" fill="#0f5f5c">必须只读，同语义才可合并</text>
  </g>
  <rect x="340" y="288" width="270" height="150" rx="8" fill="#ffffff" stroke="#0f5f5c" stroke-width="1.5"/>
  <text x="475" y="316" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#0f5f5c">Observation</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">
    <text x="356" y="344">source_id · source_version</text>
    <text x="356" y="364">sample_time · received_time</text>
    <text x="356" y="384">payload_hash · visibility</text>
    <text x="356" y="412" fill="#526072">版本可空；时钟不可靠则给区间</text>
  </g>
  <rect x="690" y="288" width="240" height="150" rx="8" fill="#ffffff" stroke="#243044"/>
  <text x="810" y="316" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#1c2430">Dependency</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">
    <text x="706" y="344">observation_id</text>
    <text x="706" y="364">predicate_id · scope</text>
    <text x="706" y="384">completeness</text>
    <text x="706" y="412" fill="#526072">必要 / 未知 / 粗粒度</text>
  </g>
  <line x1="264" y1="360" x2="332" y2="360" stroke="#0f5f5c" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="298" y="352" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#0f5f5c">产生</text>
  <line x1="610" y1="360" x2="682" y2="360" stroke="#243044" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="646" y="352" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#526072">1 : N</text>
  <path d="M475 224 V280" fill="none" stroke="#243044" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="484" y="258" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#526072">引用观测</text>
  <path d="M1020 224 V460" fill="none" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="1004" y="250" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#1d4e89">绑定 attempt</text>
  <rect x="690" y="468" width="386" height="140" rx="8" fill="#e8f1fb" stroke="#1d4e89"/>
  <text x="883" y="500" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#1d4e89">AdmissionLease</text>
  <text x="883" y="528" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">lease_id · attempt_id · earliest_start</text>
  <text x="883" y="548" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">expires_at · quota_class</text>
  <text x="883" y="576" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#526072">短期逻辑资格。观察超时即释放，不独占 GPU。</text>
  <rect x="24" y="468" width="586" height="140" rx="8" fill="#fbf6ec" stroke="#8a5a12" stroke-dasharray="6 4"/>
  <text x="317" y="500" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#8a5a12">TraceEvent</text>
  <text x="317" y="526" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#1c2430">run_id · seq · monotonic_time · type · identity · reason · usage</text>
  <text x="317" y="552" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#526072">只追加。序号与后端时间分别保存。时钟不可靠时记录误差界。</text>
  <text x="317" y="578" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#526072">evaluator 真值不写入这条日志，也不进入策略 snapshot。</text>
</svg>
